// CS2 Console Configuration for DIAMOND Dataset Capture
// =====================================================
//
// SETUP (run once):
// 1. Launch CS2
// 2. Open console (~)
// 3. Paste these settings
//
// PER-DEMO CAPTURE:
// 1. playdemo "DEMONAME"
// 2. Wait for demo to load
// 3. spec_player X  (to spectate a specific player, first person)
// 4. startmovie "OUTPUTPATH" tga
// 5. Wait for demo to finish (or enough footage)
// 6. endmovie

// Lock framerate to 16 FPS (matching DIAMOND dataset)
host_framerate 16

// Disable interpolation for clean frame capture
cl_interpolate 0

// Keep HUD visible (important for the project - testing HUD stability)
cl_drawhud 1

// Set a reasonable resolution - we'll crop/resize to 150x280 in post
// Use 4:3 aspect ratio if possible (1024x768 or 1280x960)
// This should be set in CS2 video settings before capture

// Disable any overlays
cl_showfps 0
net_graph 0

// Ensure consistent rendering
r_drawviewmodel 1
